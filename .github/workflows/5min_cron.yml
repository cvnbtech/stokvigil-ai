name: StokVigil 5-Min Market Scanner

on:
  schedule:
    # Runs every 5 minutes during Indian Market Hours (Monday - Friday)
    # 09:15 AM - 09:25 AM IST (03:45 - 03:55 UTC)
    - cron: '45,50,55 3 * * 1-5'
    # 09:30 AM - 03:25 PM IST (04:00 - 09:55 UTC)
    - cron: '*/5 4-9 * * 1-5'
    # 03:30 PM IST market close (10:00 UTC)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allows manual on-demand trigger from GitHub Actions UI

jobs:
  run-market-scan:
    name: 5-Minute Surveillance Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Multi-User Market Intelligence Scan
        env:
          RAW_BACKEND_URL: ${{ secrets.STOKVIGIL_BACKEND_URL || vars.STOKVIGIL_BACKEND_URL }}
          RAW_CRON_SECRET: ${{ secrets.CRON_SECRET_KEY || vars.CRON_SECRET_KEY }}
        run: |
          BACKEND_URL=$(echo "$RAW_BACKEND_URL" | sed 's:/*$::')
          CRON_SECRET="$RAW_CRON_SECRET"

          if [ -z "$BACKEND_URL" ]; then
            echo "❌ Error: STOKVIGIL_BACKEND_URL is not configured in GitHub Secrets or Variables."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "❌ Error: CRON_SECRET_KEY is not configured in GitHub Secrets or Variables."
            exit 1
          fi

          TARGET_URL="${BACKEND_URL}/api/cron/multi-user-scan"
          echo "🚀 Dispatching 5-minute market scan to: ${TARGET_URL}"

          RESPONSE=$(curl -s -m 480 -w "\n%{http_code}" -X POST "$TARGET_URL" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "📡 HTTP Status: $HTTP_STATUS"
          echo "📄 Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Market scan trigger failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Market surveillance scan successfully completed."
