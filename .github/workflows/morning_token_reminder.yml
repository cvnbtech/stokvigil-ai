name: StokVigil 08:50 AM Token Reminder

on:
  schedule:
    # 08:50 AM IST (03:20 UTC), Monday through Friday
    - cron: '20 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-token-reminder:
    name: Morning Demat Refresh Reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Morning Token Reminder
        env:
          RAW_BACKEND_URL: ${{ secrets.STOKVIGIL_BACKEND_URL || vars.STOKVIGIL_BACKEND_URL }}
          RAW_CRON_SECRET: ${{ secrets.CRON_SECRET_KEY || vars.CRON_SECRET_KEY }}
        run: |
          BACKEND_URL=$(echo "$RAW_BACKEND_URL" | sed 's:/*$::')
          CRON_SECRET="$RAW_CRON_SECRET"

          if [ -z "$BACKEND_URL" ]; then
            echo "❌ Error: STOKVIGIL_BACKEND_URL is not configured in GitHub Secrets or Variables."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "❌ Error: CRON_SECRET_KEY is not configured in GitHub Secrets or Variables."
            exit 1
          fi

          TARGET_URL="${BACKEND_URL}/api/cron/morning-token-reminder"
          echo "🔔 Triggering 08:50 AM Token Reminder to: ${TARGET_URL}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$TARGET_URL" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "📡 HTTP Status: $HTTP_STATUS"
          echo "📄 Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Morning reminder trigger failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Morning token reminder successfully dispatched to users."
