name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (com.app.stokvigil)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Clean & Install dependencies
        run: |
          cd mobile_app
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile_app
          SUPA_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPA_URL" ]; then SUPA_URL="${{ vars.SUPABASE_URL }}"; fi

          SUPA_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPA_KEY" ]; then SUPA_KEY="${{ vars.SUPABASE_ANON_KEY }}"; fi
          if [ -z "$SUPA_KEY" ]; then SUPA_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"; fi

          echo "Compiling APK with SUPABASE_URL length: ${#SUPA_URL}"
          flutter build apk --release --no-tree-shake-icons --dart-define=SUPABASE_URL="$SUPA_URL" --dart-define=SUPABASE_ANON_KEY="$SUPA_KEY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockvigilai-android-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
