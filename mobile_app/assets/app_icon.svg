<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c2_bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D111E"/>
      <stop offset="100%" stop-color="#080B16"/>
    </linearGradient>

    <linearGradient id="c2_line" x1="39" y1="433" x2="472" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="c2_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Body -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#c2_bg)"/>
  <rect x="7" y="7" width="498" height="498" rx="108" fill="none" stroke="rgba(6,182,212,0.25)" stroke-width="14"/>

  <!-- Candlesticks Underneath -->
  <line x1="138" y1="177" x2="138" y2="374" stroke="#10B981" stroke-width="12" opacity="0.65"/>
  <rect x="118" y="216" width="40" height="118" rx="10" fill="#10B981" opacity="0.9"/>

  <line x1="236" y1="236" x2="236" y2="394" stroke="#EF4444" stroke-width="12" opacity="0.65"/>
  <rect x="216" y="265" width="40" height="79" rx="10" fill="#EF4444" opacity="0.9"/>

  <line x1="334" y1="98" x2="334" y2="354" stroke="#06B6D4" stroke-width="12" opacity="0.65"/>
  <rect x="314" y="138" width="40" height="177" rx="10" fill="#06B6D4" opacity="0.95"/>

  <!-- Overlaid Up-Down-Up Breakout Arrow -->
  <path d="M 59,374 L 138,216 L 236,305 L 374,108" 
        stroke="url(#c2_line)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#c2_glow)"/>
  <path d="M 433,59 L 315,108 L 374,187 Z" 
        fill="url(#c2_line)" filter="url(#c2_glow)"/>
</svg>
