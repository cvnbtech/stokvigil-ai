<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D111E"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>
    <linearGradient id="v_grad" x1="270" y1="340" x2="430" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg_grad)"/>
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="rgba(6,182,212,0.35)" stroke-width="5"/>

  <g filter="url(#glow)">
    <path d="M 210,180 C 130,180 130,260 210,260 C 290,260 290,340 210,340 L 140,340" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 270,220 L 330,340 L 410,130" stroke="url(#v_grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 430,100 L 330,130 L 400,200 Z" fill="url(#v_grad)"/>
  </g>
</svg>
