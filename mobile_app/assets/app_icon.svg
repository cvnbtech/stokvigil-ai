<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- S Letter White Metallic Gradient -->
    <linearGradient id="s_grad" x1="140" y1="180" x2="290" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Breakout V Arrow Neon Spectrum Gradient -->
    <linearGradient id="v_grad" x1="270" y1="340" x2="440" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Inner Shadow & Glow Filters -->
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="drop_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded Obsidian Container -->
  <rect width="512" height="512" rx="115" fill="url(#bg_grad)"/>
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="4"/>

  <!-- Ambient Interior Light Arc -->
  <path d="M 40,40 Q 256,10 472,40" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>

  <g filter="url(#drop_shadow)">
    <!-- Metallic 'S' Letter -->
    <path d="M 215,175 C 130,175 130,255 210,255 C 290,255 290,340 205,340 L 135,340" 
          stroke="url(#s_grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Glowing Neon 'V' Breakout Arrow -->
    <g filter="url(#neon_glow)">
      <path d="M 275,215 L 335,340 L 415,125" 
            stroke="url(#v_grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 438,95 L 335,128 L 405,198 Z" fill="url(#v_grad)"/>
    </g>
  </g>
</svg>
