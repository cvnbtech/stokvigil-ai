<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="v_grad" x1="240" y1="340" x2="380" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <radialGradient id="ambient" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D111E" stop-opacity="0"/>
    </radialGradient>

    <filter id="icon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Body -->
  <rect width="512" height="512" rx="115" fill="#0D111E"/>
  <rect width="512" height="512" rx="115" fill="url(#ambient)"/>

  <!-- Centered Emblem -->
  <g filter="url(#icon_glow)">
    <!-- White Bold 'S' Curve -->
    <path d="M 215,190 C 145,190 145,260 215,260 C 285,260 285,330 215,330 L 155,330" 
          stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Cyan-Teal Trend Arrow 'V' -->
    <path d="M 265,225 L 325,330 L 395,145" 
          stroke="url(#v_grad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 415,115 L 320,145 L 385,210 Z" fill="url(#v_grad)"/>
  </g>
</svg>
